version: '3.8'

services:
  traefik:
    image: traefik
    command:
      - --api=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.mytlschallenge.acme.tlschallenge=true
      - --certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}
      - --certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_PROXY_HOPS=1
    restart: always
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - /local-files:/files
      - /opt/backups:/opt/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"

  panel-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Pass the WHOLE .env, instead of relying on the list below being complete.
    #
    # It was not complete, and the failure mode is silent: a variable set on the
    # server but absent from `environment:` is dropped with no warning. The panel
    # reads 45 variables and this file named 24 of them, so 21 never arrived —
    # among them GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET. Connecting a calendar
    # therefore built an OAuth URL with an empty client_id and Google answered
    # "Access blocked: Missing required parameter: client_id".
    #
    # It looked fine for as long as the frontend still routed /api/* to Render,
    # which had the variables. Pointing traffic at this container is what exposed
    # it. Also missing and worth knowing about: MINIO_BUCKET_NAME, MINIO_USE_SSL,
    # the AISENSY_* campaign ids, ADMIN_OTP_*, and TICKET_NOTIFY_EMAILS.
    #
    # The CRM stack already worked this way. Entries under `environment:` still
    # win over this file, which is what keeps the explicit PORT and NODE_ENV
    # below authoritative.
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "const req = require('http').request({ host: '127.0.0.1', port: 3002, path: '/health', timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.panel-backend.rule=Host(`api.${DOMAIN_NAME}`)
      - traefik.http.routers.panel-backend.tls=true
      - traefik.http.routers.panel-backend.entrypoints=web,websecure
      - traefik.http.routers.panel-backend.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.panel-backend.headers.SSLRedirect=true
      - traefik.http.middlewares.panel-backend.headers.STSSeconds=315360000
      - traefik.http.middlewares.panel-backend.headers.browserXSSFilter=true
      - traefik.http.middlewares.panel-backend.headers.contentTypeNosniff=true
      - traefik.http.middlewares.panel-backend.headers.forceSTSHeader=true
      - traefik.http.middlewares.panel-backend.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.panel-backend.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.panel-backend.headers.STSPreload=true
      - traefik.http.routers.panel-backend.middlewares=panel-backend@docker
      - traefik.http.services.panel-backend.loadbalancer.server.port=3002
      - traefik.docker.network=root_default

    environment:
      - NODE_ENV=production
      - PORT=3002
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      # Compose only forwards what is listed here. A variable set in the VPS .env
      # but absent from this block never reaches the container — it is simply
      # ignored, with no warning. Everything below was in that position.
      #
      # ACCESS_ENFORCE defaults to "false" ON PURPOSE, and the default matters:
      # the code treats anything that is not the literal string "false" as
      # enforcing, INCLUDING an empty value. So `ACCESS_ENFORCE=` in .env would
      # silently enforce. `:-false` guarantees a real "false" for the shadow
      # period. Set it to true in .env once access_shadow_denials is quiet.
      - ACCESS_ENFORCE=${ACCESS_ENFORCE:-false}
      # Seeds the Fluidadmin account on first boot. If this is empty the code
      # falls back to a password that is in git history, and that account holds
      # the superadmin scope — it can grant anyone any dashboard. SET IT.
      - FLUIDADMIN_PASSWORD=${FLUIDADMIN_PASSWORD}
      # Who may manage access grants, on top of anyone holding 'superadmin'.
      - ACCESS_ADMIN_USERS=${ACCESS_ADMIN_USERS:-aiteam@fluid.live,aiteam}
      # Content-Security-Policy ships report-only until the browser console is
      # clean; set true to switch from reporting to blocking.
      - CSP_ENFORCE=${CSP_ENFORCE:-false}
      # Escape hatch for a migration window where staff are all signing in at
      # once and tripping the 10-failures-per-15-minutes login limit.
      - RATE_LIMIT_DISABLED=${RATE_LIMIT_DISABLED:-false}
    restart: always
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        order: start-first
    networks:
      - default
      - root_default
    volumes:
      - panel_backend_data:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  traefik_data:
    external: true
  n8n_data:
    external: true
  panel_backend_data:
    external: true

networks:
  root_default:
    external: true
