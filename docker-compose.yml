version: '3.8'

services:
  traefik:
    image: traefik
    command:
      - --api=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.mytlschallenge.acme.tlschallenge=true
      - --certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}
      - --certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_PROXY_HOPS=1
    restart: always
    ports:
      - 127.0.0.1:5678:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - /local-files:/files
      - /opt/backups:/opt/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"

  panel-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.panel-backend.rule=Host(`api.${DOMAIN_NAME}`)
      - traefik.http.routers.panel-backend.tls=true
      - traefik.http.routers.panel-backend.entrypoints=web,websecure
      - traefik.http.routers.panel-backend.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.panel-backend.headers.SSLRedirect=true
      - traefik.http.middlewares.panel-backend.headers.STSSeconds=315360000
      - traefik.http.middlewares.panel-backend.headers.browserXSSFilter=true
      - traefik.http.middlewares.panel-backend.headers.contentTypeNosniff=true
      - traefik.http.middlewares.panel-backend.headers.forceSTSHeader=true
      - traefik.http.middlewares.panel-backend.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.panel-backend.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.panel-backend.headers.STSPreload=true
      - traefik.http.routers.panel-backend.middlewares=panel-backend@docker
      - traefik.http.services.panel-backend.loadbalancer.server.port=3002

    environment:
      - NODE_ENV=production
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    restart: always
    ports:
      - 3002:3002
    volumes:
      - panel_backend_data:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  traefik_data:
    external: true
  n8n_data:
    external: true
  panel_backend_data:
    external: true
