name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'panel-backend/**'
      - 'Dockerfile.backend'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e
            echo "📦 Pulling latest code..."
            cd /opt/safestories
            git pull origin main

            echo "🔍 Auto-fetching VPS hostname..."
            DOMAIN_NAME=$(hostname -f)
            echo "✅ Hostname: $DOMAIN_NAME"

            echo "🔐 Creating .env file..."
            cat > .env << EOF
            NODE_ENV=production
            PGHOST=${{ secrets.PGHOST }}
            PGPORT=${{ secrets.PGPORT }}
            PGDATABASE=${{ secrets.PGDATABASE }}
            PGUSER=${{ secrets.PGUSER }}
            PGPASSWORD=${{ secrets.PGPASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}
            MINIO_PORT=${{ secrets.MINIO_PORT }}
            MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
            MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            SSL_EMAIL=${{ secrets.SSL_EMAIL }}
            DOMAIN_NAME=$DOMAIN_NAME
            EOF

            echo "🐳 Building Docker image..."
            export DOMAIN_NAME=$DOMAIN_NAME
            
            # Save current commit hash for potential rollback
            PREVIOUS_COMMIT=$(git rev-parse HEAD@{1} 2>/dev/null || git rev-parse HEAD)
            
            if ! docker compose build panel-backend; then
              echo "❌ Build failed! Rolling back to previous commit..."
              git reset --hard $PREVIOUS_COMMIT
              exit 1
            fi

            echo "🚀 Starting backend service and waiting for healthcheck..."
            if ! docker compose up -d --wait panel-backend; then
              echo "❌ Deployment failed health check! Rolling back..."
              docker compose logs --tail 50 panel-backend
              git reset --hard $PREVIOUS_COMMIT
              docker compose build panel-backend
              docker compose up -d panel-backend
              exit 1
            fi

            echo "✅ Checking service status..."
            docker compose ps panel-backend

            echo "📊 Service logs..."
            docker compose logs --tail 20 panel-backend

      - name: Verify deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🔍 Verifying health endpoint..."
            sleep 3
            DOMAIN=$(hostname -f)
            curl -s -I https://api.$DOMAIN/health | head -1 || echo "⚠️  Health check not available yet"

      - name: Deployment Status
        if: success()
        run: echo "✅ Backend deployed successfully to VPS!"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Backend deployment failed - check logs above"
