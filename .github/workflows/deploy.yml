name: Deploy Panel Backend to VPS

on:
  push:
    branches:
      - main

# Only one deploy at a time; a newer push waits rather than racing.
concurrency:
  group: panel-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Shared deploy script, used by the first attempt and the retry step.
      DEPLOY_SCRIPT: |
            set +e

            # ══════════════════════════════════════════════════════════════
            # STAGE 0: DISCOVER where the panel stack actually runs.
            # We deploy to the running container's own compose directory, so
            # we never guess a path or touch the wrong copy. If anything here
            # is missing, we ABORT without touching the running container.
            # ══════════════════════════════════════════════════════════════
            CID=$(docker ps -q -f "label=com.docker.compose.service=panel-backend" | head -1)
            if [ -z "$CID" ]; then
              echo "❌ ABORT: no running panel-backend container found. Nothing touched."
              exit 1
            fi
            WORKDIR=$(docker inspect "$CID" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')
            IMAGE=$(docker inspect "$CID" --format '{{ .Config.Image }}')
            CNAME=$(docker inspect "$CID" --format '{{ .Name }}' | sed 's#^/##')
            echo "✓ Found panel-backend: container=$CNAME image=$IMAGE dir=$WORKDIR"

            if [ -z "$WORKDIR" ] || [ ! -d "$WORKDIR" ]; then
              echo "❌ ABORT: could not resolve compose working dir. Nothing touched."
              exit 1
            fi
            cd "$WORKDIR" || { echo "❌ ABORT: cannot cd to $WORKDIR"; exit 1; }

            if [ ! -d ".git" ]; then
              echo "❌ ABORT: $WORKDIR is not a git checkout — cannot pull. Nothing touched."
              echo "   (Panel was likely deployed without git; set that up or tell the maintainer.)"
              exit 1
            fi

            # ── Save rollback state BEFORE changing anything ──
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            docker tag "$IMAGE" "${IMAGE}-previous" 2>/dev/null || true
            echo "✓ Saved rollback point: commit ${PREV_COMMIT:-unknown}, image ${IMAGE}-previous"

            # ── Pull latest using the VPS's EXISTING git credentials.
            #    We do NOT rewrite the remote URL (no PAT needed here). If the
            #    checkout can't fetch, we abort with production untouched. ──
            if ! git fetch origin main; then
              echo "❌ ABORT: git fetch failed (VPS checkout lacks repo access?). Nothing touched."
              exit 1
            fi
            git reset --hard origin/main
            echo "✓ Code updated to origin/main"

            # NOTE: .env is intentionally NOT regenerated. The panel stack's
            # Traefik / n8n / DOMAIN_NAME config lives in the VPS .env and is
            # already correct; rewriting it risks breaking routing. We only
            # rebuild the panel-backend service.

            # ══════════════════════════════════════════════════════════════
            # STAGE 1: PRE-FLIGHT — validate + build the NEW image while the
            # old container keeps serving. Any failure aborts and restores code.
            # ══════════════════════════════════════════════════════════════
            if ! docker compose config -q; then
              echo "❌ ABORT: docker-compose config invalid. Running container untouched."
              [ -n "$PREV_COMMIT" ] && git reset --hard "$PREV_COMMIT"
              exit 1
            fi
            echo "✓ compose config valid"

            echo "🚀 Building panel-backend image..."
            if ! docker compose build panel-backend; then
              echo "❌ ABORT: build failed. Running container untouched."
              [ -n "$PREV_COMMIT" ] && git reset --hard "$PREV_COMMIT"
              exit 1
            fi
            echo "✓ build succeeded"

            # ── Rollback helper: restore previous image + code, restart ──
            rollback() {
              echo "⏪ ROLLING BACK to previous working version..."
              docker tag "${IMAGE}-previous" "$IMAGE" 2>/dev/null || true
              [ -n "$PREV_COMMIT" ] && git reset --hard "$PREV_COMMIT" || true
              docker compose up -d --no-build panel-backend || true
              sleep 15
              RB=$(docker inspect --format='{{.State.Health.Status}}' "$CNAME" 2>/dev/null || echo unknown)
              echo "⏪ Rollback complete — container status: $RB"
            }

            # ══════════════════════════════════════════════════════════════
            # STAGE 2: SWAP to the new container
            # ══════════════════════════════════════════════════════════════
            echo "🔄 Swapping panel-backend..."
            if ! docker compose up -d panel-backend; then
              echo "🚨 Swap failed!"
              rollback
              exit 1
            fi

            # ══════════════════════════════════════════════════════════════
            # STAGE 3: VERIFY container health, then the PUBLIC URL through
            # Traefik. Any failure auto-rolls-back to the previous version.
            # ══════════════════════════════════════════════════════════════
            echo "⏳ Waiting for container health..."
            HEALTHY=0
            for i in $(seq 1 12); do
              sleep 5
              ST=$(docker inspect --format='{{.State.Health.Status}}' "$CNAME" 2>/dev/null || echo not_found)
              echo "  health $i/12: $ST"
              [ "$ST" = "healthy" ] && HEALTHY=1 && break
              [ "$ST" = "unhealthy" ] && break
            done
            if [ "$HEALTHY" != "1" ]; then
              echo "🚨 New container not healthy. Logs:"
              docker compose logs --tail=50 panel-backend || true
              rollback
              exit 1
            fi
            echo "✓ container healthy"

            echo "⏳ Verifying public API through Traefik (https://api.srv1169280.hstgr.cloud)..."
            OK=0
            for i in $(seq 1 6); do
              sleep 5
              C=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "https://api.srv1169280.hstgr.cloud/health" || echo 000)
              echo "  public $i/6: /health=$C"
              [ "$C" = "200" ] && OK=1 && break
            done
            if [ "$OK" != "1" ]; then
              echo "🚨 Public URL verification FAILED — rolling back."
              rollback
              exit 1
            fi

            echo "✅ Panel backend deployed and verified end-to-end."
            docker compose ps
            exit 0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        id: deploy_attempt_1
        continue-on-error: true
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 15m
          script: ${{ env.DEPLOY_SCRIPT }}

      # SSH from GitHub runners to the VPS occasionally fails with
      # "dial tcp: i/o timeout". The deploy script is rollback-safe, so
      # retrying the whole thing once is safe.
      - name: Wait before retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: |
          echo "First SSH attempt failed — waiting 60s before retry..."
          sleep 60

      - name: Deploy to VPS via SSH (retry)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 15m
          script: ${{ env.DEPLOY_SCRIPT }}
